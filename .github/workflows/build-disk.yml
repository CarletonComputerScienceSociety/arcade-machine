---
name: Build disk images

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build container image]
    # TODO: build disk images for other branches from their container images
    branches: [main]
    types: [completed]

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BOOTC_INSTALLER_PAYLOAD_REF: "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest"
  BOOTC_REF: "localhost/iso"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}   
    strategy:
      fail-fast: false
      matrix:
        # pinned to 24.04 until https://github.com/osbuild/osbuild/issues/2579 is fixed
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
        disk-type: ["qcow2", "generic-iso"]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "BOOTC_INSTALLER_PAYLOAD_REF=${BOOTC_INSTALLER_PAYLOAD_REF,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: matrix.arch == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      # Fix overlay driver mismatch on ubuntu-24.04 (unknown on ubuntu-26.04)
      - name: Fix container storage config
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create output directory
        shell: bash
        run: mkdir -p output

      - name: Pull bootc images
        shell: bash
        run: |
          sudo podman pull "$BOOTC_INSTALLER_PAYLOAD_REF"

      - name: Build ISO installer container image
        if: matrix.disk-type == 'generic-iso'
        shell: bash
        run: sudo podman build -t localhost/iso -f iso.Containerfile

      - name: Run image-builder container
        shell: bash
        run: |
          sudo podman run --privileged --rm \
            --security-opt label=type:unconfined_t \
            -v ./disk_config:/disk_config:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "ghcr.io/osbuild/image-builder:latest" \
            --bootc-ref "${{ matrix.disk-type == 'generic-iso' && env.BOOTC_REF || env.BOOTC_INSTALLER_PAYLOAD_REF }}" \
            --bootc-installer-payload-ref "${{ matrix.disk-type == 'generic-iso' && env.BOOTC_INSTALLER_PAYLOAD_REF }}" \
            --bootc-default-fs "btrfs" \
            ${{ matrix.disk-type == 'qcow2' && '--blueprint /disk_config/img.toml' || '' }} \
            build "${{ matrix.disk-type }}"

      - name: Change ownership of output directory
        shell: bash
        run: sudo chown -R $(whoami):$(whoami) output

      - name: Upload disk images and Checksum to Job Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.disk-type == 'generic-iso' && 'arcade-os-installer.iso' || matrix.disk-type == 'qcow2' && 'arcade-os.qcow2' }}
          path: output/*
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          archive: false
